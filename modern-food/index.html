<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modernist Food</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <h1>现代主义风格的美食</h1>
        <p class="subtitle">简约不失奢华的味蕾体验</p>
    </header>
    <main class="content">
        <section class="card">
            <img src="https://picsum.photos/seed/food1/400/300" alt="美食" />
            <h2>精致沙拉</h2>
            <p>采用有机食材与现代简约摆盘，呈现包豪斯风味的健康搭配。</p>
        </section>
        <section class="card">
            <img src="https://picsum.photos/seed/food2/400/300" alt="美食" />
            <h2>布尔乔亚甜点</h2>
            <p>柔和甜度与艺术感造型，满足味觉与视觉的双重享受。</p>
        </section>
    </main>
    <footer class="footer">© 2023 Modernist Food</footer>
    <script src="script.js"></script>
</body>
</html>
